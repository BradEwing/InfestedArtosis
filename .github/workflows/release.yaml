name: Release

on:
  workflow_dispatch:
    inputs:
      republish_version:
        description: "Skip the release and re-publish this existing release tag to BASIL (e.g. 0.61). Leave blank for a normal release."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.republish_version == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.next }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Compute next version
        id: version
        run: |
          CURRENT=$(sed -n '9s/.*<version>\(.*\)<\/version>.*/\1/p' pom.xml)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          NEXT_MINOR=$((MINOR + 1))
          NEXT_VERSION="${MAJOR}.${NEXT_MINOR}"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumping version: $CURRENT -> $NEXT_VERSION"

      - name: Update pom.xml version
        run: sed -i "9s|<version>.*</version>|<version>${{ steps.version.outputs.next }}</version>|" pom.xml

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'corretto'
          cache: maven

      - name: Build JAR
        run: mvn --batch-mode --update-snapshots package

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "release ${{ steps.version.outputs.next }}"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next }}
          name: ${{ steps.version.outputs.next }}
          generate_release_notes: true
          files: target/InfestedArtosis-${{ steps.version.outputs.next }}-jar-with-dependencies.jar

  publish-basil:
    needs: release
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.release.result == 'success' || inputs.republish_version != '') }}
    runs-on: ubuntu-latest
    environment: basil
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.republish_version || needs.release.outputs.version }}
      # The organizer's link points at a single Drive file whose name must stay 0.38.zip.
      # Its content is replaced in place so the file ID, name and link never change.
      DRIVE_FILE_ID: ${{ vars.BASIL_DRIVE_FILE_ID }}
      DRIVE_FILE_NAME: 0.38.zip

    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          : "${VERSION:?release version is empty}"
          : "${DRIVE_FILE_ID:?BASIL_DRIVE_FILE_ID repository variable is not set}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}
          sparse-checkout: /BWAPI.dll
          sparse-checkout-cone-mode: false

      - name: Download release JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern '*-jar-with-dependencies.jar' --dir dist
          ls -l dist

      - name: Build BASIL zip
        run: |
          set -euo pipefail
          cp BWAPI.dll dist/
          cd dist
          JAR=$(ls ./*-jar-with-dependencies.jar)
          zip -X basil.zip "$(basename "$JAR")" BWAPI.dll
          unzip -l basil.zip
          unzip -l basil.zip | grep -q " BWAPI.dll$"
          unzip -l basil.zip | grep -q " $(basename "$JAR")$"

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: basil-${{ env.VERSION }}
          path: dist/basil.zip
          retention-days: 7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/drive
          create_credentials_file: false
          export_environment_variables: false

      - name: Upload zip to Google Drive
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          umask 077
          printf 'Authorization: Bearer %s\n' "$ACCESS_TOKEN" > auth.header
          trap 'rm -f auth.header' EXIT
          CURL="curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 300 -H @auth.header"

          BEFORE=$($CURL "https://www.googleapis.com/drive/v3/files/${DRIVE_FILE_ID}?fields=name,md5Checksum,size")
          echo "Before: $BEFORE"
          NAME=$(jq -r '.name // empty' <<<"$BEFORE")
          if [ "$NAME" != "$DRIVE_FILE_NAME" ]; then
            echo "::error::Drive file ${DRIVE_FILE_ID} is named '${NAME}', expected '${DRIVE_FILE_NAME}'"
            exit 1
          fi

          SESSION=$($CURL -X PATCH -D - -o /dev/null \
            -H 'Content-Type: application/json' -H 'X-Upload-Content-Type: application/zip' -d '{}' \
            "https://www.googleapis.com/upload/drive/v3/files/${DRIVE_FILE_ID}?uploadType=resumable&fields=name,md5Checksum,size" \
            | tr -d '\r' | sed -n 's/^[Ll]ocation: //p')
          : "${SESSION:?Drive did not return a resumable upload session}"

          AFTER=$(curl -sS --fail-with-body --max-time 600 -H @auth.header -X PUT -H 'Content-Type: application/zip' --data-binary @dist/basil.zip "$SESSION")
          echo "After:  $AFTER"

          EXPECTED=$(md5sum dist/basil.zip | cut -d' ' -f1)
          ACTUAL=$(jq -r '.md5Checksum // empty' <<<"$AFTER")
          if [ -z "$ACTUAL" ]; then
            echo "::error::Drive response contained no md5Checksum"
            exit 1
          fi
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Drive md5 ($ACTUAL) does not match uploaded zip ($EXPECTED)"
            exit 1
          fi
          echo "Published $VERSION to BASIL Drive file ${DRIVE_FILE_ID} (${DRIVE_FILE_NAME})"
